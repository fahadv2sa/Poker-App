<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 300" preserveAspectRatio="none" fill="none" stroke="#f2d27a" stroke-linejoin="round" stroke-linecap="round">
  <!-- Faint gold football-pitch markings, VERTICAL (portrait) orientation: one
       goal at the TOP (opponents' end), one at the BOTTOM (my end), halfway line
       running horizontally across the middle. Layered ON TOP of the molten felt
       as a subtle, symmetric border/frame; stretched to the felt via
       background-size:100% 100%. Decorative only — a thin overlay, never the
       surface itself. -->
  <!-- touchline boundary (the "border") -->
  <rect x="5" y="5" width="180" height="290" rx="13" ry="13" stroke-width="2.2" stroke-opacity="0.5"/>
  <!-- halfway line (horizontal) + centre circle + spot -->
  <line x1="5" y1="150" x2="185" y2="150" stroke-width="1.6" stroke-opacity="0.4"/>
  <circle cx="95" cy="150" r="30" stroke-width="1.6" stroke-opacity="0.4"/>
  <circle cx="95" cy="150" r="2.2" fill="#f2d27a" fill-opacity="0.5" stroke="none"/>
  <!-- TOP goal: penalty area + goal area + spot + arc (opponents' end) -->
  <rect x="52" y="5" width="86" height="46" stroke-width="1.6" stroke-opacity="0.38"/>
  <rect x="75" y="5" width="40" height="20" stroke-width="1.4" stroke-opacity="0.32"/>
  <circle cx="95" cy="34" r="1.8" fill="#f2d27a" fill-opacity="0.45" stroke="none"/>
  <path d="M70.3 51 A30 30 0 0 0 119.7 51" stroke-width="1.5" stroke-opacity="0.36"/>
  <!-- BOTTOM goal: penalty area + goal area + spot + arc (my end) -->
  <rect x="52" y="249" width="86" height="46" stroke-width="1.6" stroke-opacity="0.38"/>
  <rect x="75" y="275" width="40" height="20" stroke-width="1.4" stroke-opacity="0.32"/>
  <circle cx="95" cy="266" r="1.8" fill="#f2d27a" fill-opacity="0.45" stroke="none"/>
  <path d="M70.3 249 A30 30 0 0 1 119.7 249" stroke-width="1.5" stroke-opacity="0.36"/>
</svg>
