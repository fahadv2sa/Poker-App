# Railway deployment — Football-B platform monorepo (pnpm workspaces + Turborepo).
#
# ARCHITECTURE (one GitHub repo) — ONE shared web service serves ALL game UIs on ONE
# domain; each game's realtime backend is its OWN service:
#   Service "link-up"             → apps/web          (Next.js)   →  game1.fmgtech.dev
#       Hosts the platform hub + Link Up (/games/link-up) + Top Ten (/games/top-10).
#   Service "game-server-link-up" → apps/game-server  (Socket.IO) →  Link Up realtime
#   Service "game-server-top-10"  → apps/top-10-server(Socket.IO) →  Top Ten realtime
#   Plugin  "Postgres"            → Railway PostgreSQL (shared; Top Ten owns `top_10`)
#
# NOTE: Top Ten's WEB UI is NOT a separate service — it lives inside apps/web at
# /games/top-10 (shared web service, one domain). Only its game-server is separate.
#
# SERVICE NAMES (renamed 2026-06-24): the Railway service LABELS are now "link-up"
# (= apps/web) and "game-server-link-up" (= apps/game-server); project "Football-B";
# DB plugin "Postgres" (unchanged). App directories + @fb/* package names are
# UNCHANGED — only the Railway service labels changed. ${{ }} cross-service refs
# must use these service names.
#
# Railway does NOT create multiple services from a single config file. Create each
# service in the dashboard (New Service → this GitHub repo), keep Root Directory at
# the repo ROOT (so the pnpm workspace installs once and the root `postinstall`
# runs `prisma generate` for both), then set each service's Build/Start commands
# to its section below. The shared [build]/[deploy] defaults here apply to any
# service whose "Config File Path" points at this file.
#
# ─────────────────────────────────────────────────────────────────────────────
# Service: link-up  (apps/web)  →  game1.fmgtech.dev  — the ONE shared web service
#   Serves the hub + Link Up (/games/link-up) + Top Ten (/games/top-10).
#   Root Directory : (repo root)
#   Build Command  : pnpm --filter @fb/web build
#   Start Command  : pnpm --filter @fb/web start
#   Variables      : DATABASE_URL, DIRECT_URL, AUTH_SECRET, AUTH_URL,
#                    NEXT_PUBLIC_GAME_SERVER_URL   (Link Up realtime),
#                    NEXT_PUBLIC_TOP10_SERVER_URL  (Top Ten realtime)
#                    (NEXT_PUBLIC_* are baked at BUILD time — set them before building)
#   Replicas       : 1+  (stateless — safe to scale horizontally)
#
# Service: game-server-link-up  (apps/game-server)  —  Link Up realtime
#   Root Directory : (repo root)
#   Build Command  : (none — tsx runs TypeScript source; install + postinstall suffices)
#   Start Command  : pnpm --filter @fb/game-server start      # → tsx src/index.ts
#   Variables      : DATABASE_URL, DIRECT_URL, AUTH_SECRET, WEB_ORIGIN (= game1 web URL)
#                    (PORT is injected by Railway — do not set it)
#   Replicas       : EXACTLY 1  (authoritative in-memory room state + timers — never scale)
#
# Service: game-server-top-10  (apps/top-10-server)  —  Top Ten realtime
#   Same repo, same shared Postgres (Top Ten owns the `top_10` schema). Build the
#   question catalog once against prod before first deploy (done; see docs/top-10/DEPLOY.md).
#   Root Directory : (repo root)
#   Build Command  : (none — tsx runs TypeScript source)
#   Start Command  : pnpm --filter @fb/top-10-server start  # → tsx src/index.ts
#   Variables      : DATABASE_URL, DIRECT_URL, AUTH_SECRET (== Link Up's),
#                    WEB_ORIGIN (= game1 web URL, for CORS), BOTS_ENABLED (optional)
#                    (PORT injected by Railway — do not set it)
#   Replicas       : EXACTLY 1  (authoritative in-memory match state + timers)
#
# Service: game-server-guess-player  (apps/guess-player-server)  —  Guess the Player realtime
#   Game #3 (خمن اللاعب). Same repo, same shared Postgres (owns the `guess_player`
#   schema; reads football.* through the @fb/db seam). BEFORE first deploy: seed the
#   trophy whitelist against prod (pnpm --filter @fb/db seed:gp-trophies) and replicate
#   football._apifootball_import_progress local→prod (without it the trophy/NT
#   completeness gates degrade every negative to "cannot answer"). No bots in v1.
#   Root Directory : (repo root)
#   Build Command  : (none — tsx runs TypeScript source)
#   Start Command  : pnpm --filter @fb/guess-player-server start  # → tsx src/index.ts
#   Variables      : DATABASE_URL, DIRECT_URL, AUTH_SECRET (== Link Up's),
#                    WEB_ORIGIN (= game1 web URL, for CORS)
#                    (PORT injected by Railway — do not set it)
#   Replicas       : EXACTLY 1  (authoritative in-memory match state + timers)
# ─────────────────────────────────────────────────────────────────────────────
#
# ── PER-SERVICE DEPLOYS (no project-wide redeploy) ─────────────────────────────
# All services share Root Directory = repo root + one deploy branch, so WITHOUT a
# path filter every push rebuilds every service. Set per-service **Watch Paths**
# (Dashboard → service → Settings → Build → Watch Paths) so each rebuilds only on its
# own code (+ the shared packages it depends on). Repo-root-relative globs:
#
#   link-up (apps/web — all game UIs):
#     apps/web/**, packages/admin-core/**, packages/db/**, packages/shared/**,
#     packages/table-ui/**, packages/top-10-engine/**, packages/top-10-ui/**,
#     packages/guess-player-engine/**,
#     package.json, pnpm-lock.yaml, pnpm-workspace.yaml, turbo.json, tsconfig.base.json, railway.toml
#   game-server-link-up (apps/game-server):
#     apps/game-server/**, packages/engine/**, packages/db/**, packages/shared/**, + the root files above
#   game-server-top-10 (apps/top-10-server):
#     apps/top-10-server/**, packages/top-10-engine/**, packages/db/**, packages/shared/**, + the root files above
#   game-server-guess-player (apps/guess-player-server):
#     apps/guess-player-server/**, packages/guess-player-engine/**, packages/db/**, packages/shared/**, + the root files above
#
# Result: a Top-Ten realtime change (apps/top-10-server/**, packages/top-10-engine/**)
# never redeploys Link Up. A Top-Ten WEB change (apps/web/games/top-10) DOES redeploy
# the shared web service (so Link Up's web redeploys too — same service, stateless;
# Link Up gameplay = the separate game-server, untouched). Genuinely shared changes
# (packages/shared, packages/db) correctly redeploy their dependents.
# ─────────────────────────────────────────────────────────────────────────────

[build]
builder = "NIXPACKS"

[deploy]
# ── MIGRATE-FIRST GUARD (the lasting fix for the 2026-06-21 schema/code outage) ──
# Railway runs preDeployCommand in a one-off instance AFTER build succeeds and
# BEFORE the new version starts receiving traffic; if it exits non-zero the deploy
# is ABORTED and the previous version keeps serving. So a push can no longer ship
# schema-dependent code ahead of its migration — prod is migrated first, every time.
#
# `pnpm db:deploy` → `prisma migrate deploy`: applies only PENDING migrations,
# never resets/drops, and is idempotent (already-applied migrations are skipped).
# It takes an advisory lock on _prisma_migrations, so if both services deploy at
# once the concurrent runs serialize safely. Inherited by every service whose
# Config File Path points at this railway.toml (link-up AND game-server-link-up) —
# running it per-service is harmless because it is idempotent.
#
# Prisma 7: the connection URL lives in packages/db/prisma.config.ts, which reads
# `DIRECT_URL ?? DATABASE_URL` (the schema no longer declares `directUrl`). A
# service whose RUNTIME only needs DATABASE_URL (e.g. game-server-link-up) may not
# have DIRECT_URL set, so we export it below. We keep exporting DIRECT_URL (falling
# back to DATABASE_URL) so the CLI always has a value (on Railway PG they are the
# same; a future Neon split sets a real DIRECT_URL, which takes precedence).
# Requires only DATABASE_URL in each service's variables.
preDeployCommand = 'DIRECT_URL="${DIRECT_URL:-$DATABASE_URL}" pnpm db:deploy'
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Keep at 1: the game-server holds room state in memory and must be a single
# instance. The web app is stateless and may be scaled separately in its own service.
numReplicas = 1
