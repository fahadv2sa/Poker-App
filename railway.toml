# Railway deployment — Link Up monorepo (pnpm workspaces + Turborepo).
#
# Architecture — all from this one GitHub repo:
#   Service "link-up"             → apps/web         (Next.js)    →  poker.fmgtech.dev
#   Service "game-server-link-up" → apps/game-server (Socket.IO)  →  poker-rt.fmgtech.dev
#   Plugin  "Postgres"            → Railway PostgreSQL
#
# SERVICE NAMES (renamed 2026-06-24): the Railway service LABELS are now "link-up"
# (= apps/web) and "game-server-link-up" (= apps/game-server); project "Football-B";
# DB plugin "Postgres" (unchanged). App directories + @fb/* package names are
# UNCHANGED — only the Railway service labels changed. ${{ }} cross-service refs
# must use these service names.
#
# Railway does NOT create multiple services from a single config file. Create each
# service in the dashboard (New Service → this GitHub repo), keep Root Directory at
# the repo ROOT (so the pnpm workspace installs once and the root `postinstall`
# runs `prisma generate` for both), then set each service's Build/Start commands
# to its section below. The shared [build]/[deploy] defaults here apply to any
# service whose "Config File Path" points at this file.
#
# ─────────────────────────────────────────────────────────────────────────────
# Service: link-up  (apps/web)
#   Root Directory : (repo root)
#   Build Command  : pnpm --filter @fb/web build
#   Start Command  : pnpm --filter @fb/web start
#   Variables      : DATABASE_URL, DIRECT_URL, AUTH_SECRET, AUTH_URL,
#                    NEXT_PUBLIC_GAME_SERVER_URL
#                    (NEXT_PUBLIC_* is baked in at BUILD time — set it before building)
#   Replicas       : 1+  (stateless — safe to scale horizontally)
#
# Service: game-server-link-up  (apps/game-server)
#   Root Directory : (repo root)
#   Build Command  : (none — tsx runs TypeScript source; install + postinstall suffices)
#   Start Command  : pnpm --filter @fb/game-server start      # → tsx src/index.ts
#   Variables      : DATABASE_URL, DIRECT_URL, AUTH_SECRET, WEB_ORIGIN
#                    (PORT is injected by Railway — do not set it)
#   Replicas       : EXACTLY 1  (authoritative in-memory room state + timers — never scale)
# ─────────────────────────────────────────────────────────────────────────────
#
# ── TOP TEN (game #2 — توب 10) — TWO ADDITIONAL, INDEPENDENT services ──────────
# Same repo, same shared Postgres (identity + football shared; Top Ten owns the
# `top_10` schema). Fully separate from Link Up at runtime. The shared [deploy]
# preDeployCommand below (prisma migrate deploy) is idempotent and applies to these
# too, so the additive top_10 migration ships migrate-first like everything else.
# NOTE: before first deploy, build the question catalog once against prod:
#   NODE_OPTIONS=--use-system-ca DATABASE_URL=<prod> pnpm db:build-top10-catalog
#
# Service: top-10  (apps/top-10-web — Next.js)
#   Root Directory : (repo root)
#   Build Command  : pnpm --filter @fb/top-10-web build
#   Start Command  : pnpm --filter @fb/top-10-web start    # next start -p $PORT
#   Variables      : DATABASE_URL, DIRECT_URL, AUTH_SECRET (== Link Up's), AUTH_URL,
#                    NEXT_PUBLIC_TOP10_SERVER_URL  (baked at build — set before build)
#   Replicas       : 1+  (stateless)
#   Also set on the HUB (link-up web): NEXT_PUBLIC_TOP10_WEB_URL = this service's URL
#
# Service: game-server-top-10  (apps/top-10-server — Socket.IO)
#   Root Directory : (repo root)
#   Build Command  : (none — tsx runs TypeScript source)
#   Start Command  : pnpm --filter @fb/top-10-server start  # → tsx src/index.ts
#   Variables      : DATABASE_URL, DIRECT_URL, AUTH_SECRET (== Link Up's),
#                    WEB_ORIGIN (= the top-10 web URL), BOTS_ENABLED (optional)
#                    (PORT injected by Railway — do not set it)
#   Replicas       : EXACTLY 1  (authoritative in-memory match state + timers)
# ─────────────────────────────────────────────────────────────────────────────

[build]
builder = "NIXPACKS"

[deploy]
# ── MIGRATE-FIRST GUARD (the lasting fix for the 2026-06-21 schema/code outage) ──
# Railway runs preDeployCommand in a one-off instance AFTER build succeeds and
# BEFORE the new version starts receiving traffic; if it exits non-zero the deploy
# is ABORTED and the previous version keeps serving. So a push can no longer ship
# schema-dependent code ahead of its migration — prod is migrated first, every time.
#
# `pnpm db:deploy` → `prisma migrate deploy` (reads DIRECT_URL): applies only
# PENDING migrations, never resets/drops, and is idempotent (already-applied
# migrations are skipped). It takes an advisory lock on _prisma_migrations, so if
# both services deploy at once the concurrent runs serialize safely. Inherited by
# every service whose Config File Path points at this railway.toml (link-up AND
# game-server-link-up) — running it per-service is harmless because it is idempotent.
#
# `prisma migrate deploy` reads DIRECT_URL (the schema declares directUrl). A
# service whose RUNTIME only needs DATABASE_URL (e.g. game-server-link-up) may not have
# DIRECT_URL set, which would make the migrate step — and thus the whole deploy —
# fail with P1012. So fall back to DATABASE_URL when DIRECT_URL is unset (on
# Railway PG they are the same value; a future Neon split sets a real DIRECT_URL,
# which takes precedence). Requires only DATABASE_URL in each service's variables.
preDeployCommand = 'DIRECT_URL="${DIRECT_URL:-$DATABASE_URL}" pnpm db:deploy'
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Keep at 1: the game-server holds room state in memory and must be a single
# instance. The web app is stateless and may be scaled separately in its own service.
numReplicas = 1
