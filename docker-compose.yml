# PostgreSQL for local development.
#   docker compose up -d
# Connection string (matches .env.example):
#   postgresql://football:football@localhost:5432/football_poker?schema=public
services:
  postgres:
    image: postgres:16-alpine
    container_name: football_poker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
      POSTGRES_DB: football_poker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football_poker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
